name: Experimental ZAPD WebAssembly build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-zapd-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out ZAPD source
        uses: actions/checkout@v4
        with:
          repository: zeldaret/mm
          path: upstream-zapd
          sparse-checkout: |
            tools/ZAPD
          sparse-checkout-cone-mode: true

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Install native build helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3

      - name: Show compiler versions
        run: |
          emcc --version
          em++ --version

      - name: Apply WebAssembly compatibility fixes
        working-directory: upstream-zapd/tools/ZAPD
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ZAPD/CrashHandler.cpp")
          s = p.read_text()
          s = s.replace("#if __has_include(<unistd.h>)", "#if __has_include(<unistd.h>) && !defined(__EMSCRIPTEN__)")
          p.write_text(s)
          p = Path("ZAPDUtils/Utils/StringHelper.h")
          s = p.read_text()
          if "#include <cstdlib>" not in s:
              s = s.replace("#include <cstring>", "#include <cstring>\\n#include <cstdlib>")
          s = s.replace("std::strtoull(", "strtoull(")
          p.write_text(s)
          PY

      - name: Attempt ZAPD WebAssembly build
        working-directory: upstream-zapd/tools/ZAPD
        env:
          CXX: em++
          OPTIMIZATION_ON: "1"
          DEPRECATION_ON: "0"
          LLD: "0"
        run: |
          emmake make -j2 CXX=em++ \
            'CXXFLAGS=-std=c++17 -O2 -I ZAPD -I lib/libgfxd -I lib/tinyxml2 -I ZAPDUtils' \
            'LDFLAGS=-lm -sUSE_LIBPNG=1 -sALLOW_MEMORY_GROWTH=1 -sFORCE_FILESYSTEM=1' \
            ZAPD.out

      - name: Verify WebAssembly output
        run: |
          test -f upstream-zapd/tools/ZAPD/ZAPD.out
          file upstream-zapd/tools/ZAPD/ZAPD.out
          cp upstream-zapd/tools/ZAPD/ZAPD.out zapd.js
          test -f upstream-zapd/tools/ZAPD/ZAPD.out.wasm
          cp upstream-zapd/tools/ZAPD/ZAPD.out.wasm zapd.wasm
          ls -lh zapd.js zapd.wasm

      - name: Upload experimental build
        uses: actions/upload-artifact@v4
        with:
          name: zapd-wasm-experiment
          path: |
            zapd.js
            zapd.wasm
          if-no-files-found: error
          retention-days: 7
