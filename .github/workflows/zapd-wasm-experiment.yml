name: Experimental ZAPD WebAssembly build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-zapd-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out ZAPD source
        uses: actions/checkout@v4
        with:
          repository: zeldaret/mm
          path: upstream-zapd
          sparse-checkout: |
            tools/ZAPD
          sparse-checkout-cone-mode: true

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Install native build helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3

      - name: Show compiler versions
        run: |
          emcc --version
          em++ --version

      - name: Apply WebAssembly compatibility fixes
        working-directory: upstream-zapd/tools/ZAPD
        run: |
          python3 - <<'PY'
          from pathlib import Path

          crash = Path("ZAPD/CrashHandler.cpp")
          source = crash.read_text()
          old_posix = "#if __has_include(<unistd.h>)"
          new_posix = "#if __has_include(<unistd.h>) && !defined(__EMSCRIPTEN__)"
          if new_posix not in source:
              if source.count(old_posix) != 1:
                  raise SystemExit("Could not safely locate POSIX crash-handler condition")
              source = source.replace(old_posix, new_posix, 1)
          old_include = '#include "CrashHandler.h"'
          new_include = old_include + '\n#include "WarningHandler.h"'
          if new_include not in source:
              if source.count(old_include) != 1:
                  raise SystemExit("Could not safely locate CrashHandler.h include")
              source = source.replace(old_include, new_include, 1)
          crash.write_text(source)

          helper = Path("ZAPDUtils/Utils/StringHelper.h")
          source = helper.read_text()
          if "#include <cstdlib>" not in source:
              include = "#include <cstring>"
              if source.count(include) != 1:
                  raise SystemExit("Could not safely locate cstring include")
              source = source.replace(include, include + chr(10) + "#include <cstdlib>", 1)
          helper.write_text(source)
          PY

      - name: Attempt ZAPD WebAssembly build
        working-directory: upstream-zapd/tools/ZAPD
        env:
          CXX: em++
          OPTIMIZATION_ON: "1"
          DEPRECATION_ON: "0"
          LLD: "0"
        run: |
          emmake make -j2 CXX=em++ \
            'CXXFLAGS=-std=c++17 -O2 -sUSE_LIBPNG=1 -I ZAPD -I lib/libgfxd -I lib/tinyxml2 -I ZAPDUtils' \
            'LDFLAGS=-lm -sUSE_LIBPNG=1 -sALLOW_MEMORY_GROWTH=1 -sFORCE_FILESYSTEM=1 -sASSERTIONS=2 -sSTACK_OVERFLOW_CHECK=2 -sSAFE_HEAP=1' \
            ZAPD.out

      - name: Verify WebAssembly output
        run: |
          set -eux
          ls -lah upstream-zapd/tools/ZAPD/ZAPD.out*
          file upstream-zapd/tools/ZAPD/ZAPD.out
          test -f upstream-zapd/tools/ZAPD/ZAPD.out
          cp upstream-zapd/tools/ZAPD/ZAPD.out zapd.js
          wasm_file="$(find upstream-zapd/tools/ZAPD -maxdepth 2 -type f -name '*.wasm' -print -quit)"
          test -n "$wasm_file"
          cp "$wasm_file" zapd.wasm
          cp zapd.wasm ZAPD.wasm
          ls -lh zapd.js zapd.wasm ZAPD.wasm

      - name: Smoke-test ZAPD runtime
        run: |
          set -euxo pipefail
          node --version
          set +e
          timeout 30s node zapd.js --help > zapd-smoke-test.txt 2>&1
          status=$?
          set -e
          cat zapd-smoke-test.txt
          if [ "$status" -eq 124 ]; then
            echo "ZAPD timed out during startup" >&2
            exit 1
          fi
          if [ "$status" -gt 1 ]; then
            echo "ZAPD exited with unexpected status $status" >&2
            exit "$status"
          fi
          test -s zapd-smoke-test.txt

      - name: Test ZAPD extraction with synthetic fixture
        run: |
          set -euxo pipefail
          mkdir -p zapd-fixture/baserom zapd-fixture/output
          printf '\x00\x11\x22\x33\x44\x55\x66\x77' > zapd-fixture/baserom/test_asset
          test "$(wc -c < zapd-fixture/baserom/test_asset)" -eq 8
          cat > zapd-fixture/test_asset.xml <<'XML'
          <Root>
            <File Name="test_asset">
              <Blob Name="gTestBlob" Size="0x8" Offset="0x0" />
            </File>
          </Root>
          XML
          set +e
          node zapd.js e -i zapd-fixture/test_asset.xml -o zapd-fixture/output -b zapd-fixture/baserom -v 3 > zapd-extraction-test.txt 2>&1
          status=$?
          set -e
          cat zapd-extraction-test.txt
          if [ "$status" -ne 0 ]; then
            echo "ZAPD extraction failed with status $status" >&2
            exit "$status"
          fi
          find zapd-fixture/output -maxdepth 4 -type f -print
          test -n "$(find zapd-fixture/output -type f -print -quit)"

      - name: Upload experimental build
        uses: actions/upload-artifact@v4
        with:
          name: zapd-wasm-experiment
          path: |
            zapd.js
            zapd.wasm
          if-no-files-found: error
          retention-days: 7
