name: Experimental ZAPD WebAssembly build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-zapd-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out ZAPD source
        uses: actions/checkout@v4
        with:
          repository: zeldaret/mm
          path: upstream-zapd
          sparse-checkout: |
            tools/ZAPD
          sparse-checkout-cone-mode: true

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Install native build helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3

      - name: Show compiler versions
        run: |
          emcc --version
          em++ --version

      - name: Apply WebAssembly compatibility fixes
        working-directory: upstream-zapd/tools/ZAPD
        run: |
          python3 - <<'PY'
          from pathlib import Path

          crash = Path("ZAPD/CrashHandler.cpp")
          source = crash.read_text()
          old_posix = "#if __has_include(<unistd.h>)"
          new_posix = "#if __has_include(<unistd.h>) && !defined(__EMSCRIPTEN__)"
          if new_posix not in source:
              if source.count(old_posix) != 1:
                  raise SystemExit("Could not safely locate POSIX crash-handler condition")
              source = source.replace(old_posix, new_posix, 1)
          old_include = '#include "CrashHandler.h"'
          new_include = old_include + '\n#include "WarningHandler.h"'
          if new_include not in source:
              if source.count(old_include) != 1:
                  raise SystemExit("Could not safely locate CrashHandler.h include")
              source = source.replace(old_include, new_include, 1)
          crash.write_text(source)

          helper = Path("ZAPDUtils/Utils/StringHelper.h")
          source = helper.read_text()
          if "#include <cstdlib>" not in source:
              include = "#include <cstring>"
              if source.count(include) != 1:
                  raise SystemExit("Could not safely locate cstring include")
              source = source.replace(include, include + chr(10) + "#include <cstdlib>", 1)
          helper.write_text(source)
          PY

      - name: Attempt ZAPD WebAssembly build
        working-directory: upstream-zapd/tools/ZAPD
        env:
          CXX: em++
          OPTIMIZATION_ON: "1"
          DEPRECATION_ON: "0"
          LLD: "0"
        run: |
          emmake make -j2 CXX=em++ \
            'CXXFLAGS=-std=c++17 -O2 -sUSE_LIBPNG=1 -I ZAPD -I lib/libgfxd -I lib/tinyxml2 -I ZAPDUtils' \
            'LDFLAGS=-lm -sUSE_LIBPNG=1 -sALLOW_MEMORY_GROWTH=1 -sFORCE_FILESYSTEM=1' \
            ZAPD.out

      - name: Verify WebAssembly output
        run: |
          test -f upstream-zapd/tools/ZAPD/ZAPD.out
          file upstream-zapd/tools/ZAPD/ZAPD.out
          cp upstream-zapd/tools/ZAPD/ZAPD.out zapd.js
          test -f upstream-zapd/tools/ZAPD/ZAPD.out.wasm
          cp upstream-zapd/tools/ZAPD/ZAPD.out.wasm zapd.wasm
          ls -lh zapd.js zapd.wasm

      - name: Upload experimental build
        uses: actions/upload-artifact@v4
        with:
          name: zapd-wasm-experiment
          path: |
            zapd.js
            zapd.wasm
          if-no-files-found: error
          retention-days: 7
