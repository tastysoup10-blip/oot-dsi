name: Build DSi graphics prototypes

on:
  push:
    paths:
      - "dsi-test/**"
      - "dsi-texture-camera/**"
      - "dsi-terrain/**"\n      - "dsi-player-movement/**"
      - ".github/workflows/build-dsi-test.yml"
  pull_request:
    paths:
      - "dsi-test/**"
      - "dsi-texture-camera/**"
      - "dsi-terrain/**"
      - ".github/workflows/build-dsi-test.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: skylyrac/blocksds:slim-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build original cube test
        run: make
        working-directory: dsi-test

      - name: Build textured camera test
        run: make
        working-directory: dsi-texture-camera

      - name: Build terrain test
        run: make
        working-directory: dsi-terrain

      - name: Build player movement test\n        run: make\n        working-directory: dsi-player-movement\n\n      - name: Upload .nds build
        uses: actions/upload-artifact@v4
        with:
          name: oot-dsi-3d-test
          path: |
            dsi-test/*.nds
            dsi-texture-camera/*.nds
            dsi-terrain/*.nds\n            dsi-player-movement/*.nds
          if-no-files-found: error
          retention-days: 30
